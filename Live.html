<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>🔴 LIVE — Godé</title>
<meta name="description" content="Regarder le live Godé en direct">
<meta name="theme-color" content="#0d47a1">

<style>
  /* ========== RESET & BASE ========== */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #0d47a1 0%, #1565c0 50%, #42a5f5 100%);
    color: #ffffff;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(255, 215, 0, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.10) 0%, transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  /* ========== HEADER ========== */
  .header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: rgba(13, 71, 161, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(255, 215, 0, 0.4);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .header-title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
  }

  .header-title .crown {
    color: #ffd700;
    margin-right: 6px;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: #ff0000;
    color: #ffffff;
    font-size: 12px;
    font-weight: 700;
    border-radius: 20px;
    letter-spacing: 0.5px;
    box-shadow: 0 2px 10px rgba(255, 0, 0, 0.5);
    animation: pulse 2s ease-in-out infinite;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: #ffffff;
    border-radius: 50%;
    animation: blink 1s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ========== CONTAINER PRINCIPAL ========== */
  .main-container {
    position: relative;
    z-index: 5;
    max-width: 1400px;
    margin: 0 auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* ========== TITRE ========== */
  .page-title {
    text-align: center;
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    text-shadow: 
      0 2px 12px rgba(0, 0, 0, 0.5),
      0 0 30px rgba(255, 215, 0, 0.3);
    letter-spacing: 1px;
  }

  .page-subtitle {
    text-align: center;
    font-size: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    margin-top: 8px;
  }

  /* ========== LECTEUR VIDÉO ========== */
  .video-wrapper {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000000;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 
      0 20px 60px rgba(0, 0, 0, 0.5),
      0 0 0 3px rgba(255, 215, 0, 0.4),
      0 0 0 6px rgba(13, 71, 161, 0.6);
    animation: glow 3s ease-in-out infinite alternate;
  }

  @keyframes glow {
    from {
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 0 3px rgba(255, 215, 0, 0.4),
        0 0 0 6px rgba(13, 71, 161, 0.6);
    }
    to {
      box-shadow: 
        0 20px 80px rgba(0, 0, 0, 0.6),
        0 0 0 3px rgba(255, 215, 0, 0.7),
        0 0 0 6px rgba(21, 101, 192, 0.8);
    }
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  /* ========== FALLBACK ========== */
  .fallback {
    margin-top: -12px;
    padding: 16px 20px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .fallback-text {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.85);
    margin: 0;
  }

  .fallback-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    background: linear-gradient(180deg, #ff1744 0%, #d50000 100%);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
    border-radius: 50px;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(255, 23, 68, 0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .fallback-button:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(255, 23, 68, 0.7);
  }

  .fallback-button:active {
    transform: scale(0.98);
  }

  /* ========== INFO BAR ========== */
  .info-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 14px 20px;
    background: rgba(255, 255, 255, 0.10);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.15);
  }

  .info-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.95);
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 10px;
  }

  .info-item .emoji {
    font-size: 16px;
  }

  /* ========== FOOTER ========== */
  .footer {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 24px 16px;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
  }

  .footer .crown {
    color: #ffd700;
    font-size: 20px;
    display: block;
    margin-bottom: 6px;
  }

  /* ========== RESPONSIVE MOBILE ========== */
  @media (max-width: 768px) {
    .header {
      padding: 12px 16px;
    }

    .header-title {
      font-size: 16px;
    }

    .live-badge {
      font-size: 11px;
      padding: 5px 10px;
    }

    .main-container {
      padding: 16px 12px;
      gap: 16px;
    }

    .page-title {
      font-size: 22px;
    }

    .page-subtitle {
      font-size: 14px;
    }

    .video-wrapper {
      border-radius: 14px;
      box-shadow: 
        0 12px 40px rgba(0, 0, 0, 0.5),
        0 0 0 2px rgba(255, 215, 0, 0.5);
      animation: none;
    }

    .fallback {
      padding: 12px 14px;
      gap: 8px;
    }

    .fallback-text {
      font-size: 12px;
    }

    .fallback-button {
      font-size: 13px;
      padding: 10px 22px;
    }

    .info-bar {
      padding: 10px 12px;
      gap: 8px;
    }

    .info-item {
      font-size: 12px;
      padding: 5px 10px;
    }

    .footer {
      font-size: 12px;
    }
  }

  @media (max-width: 480px) {
    .page-title {
      font-size: 18px;
    }

    .page-subtitle {
      font-size: 12px;
    }

    .info-item {
      font-size: 11px;
    }
  }

  /* ========== MODE PAYSAGE MOBILE ========== */
  @media (max-height: 500px) and (orientation: landscape) {
    .header {
      padding: 6px 12px;
    }

    .header-title {
      font-size: 14px;
    }

    .main-container {
      padding: 8px;
      gap: 8px;
    }

    .page-title, .page-subtitle, .info-bar, .footer, .fallback {
      display: none;
    }

    .video-wrapper {
      border-radius: 8px;
      max-height: calc(100vh - 50px);
      width: auto;
      margin: 0 auto;
    }
  }
</style>
</head>
<body>

<!-- ========== HEADER ========== -->
<header class="header">
  <div class="header-title">
    <span class="crown">👑</span> GODÉ
  </div>
  <div class="live-badge">
    <span class="live-dot"></span>
    EN DIRECT
  </div>
</header>

<!-- ========== MAIN ========== -->
<main class="main-container">

  <div>
    <h1 class="page-title">🔴 Le live démarre dans un instant !</h1>
    <p class="page-subtitle">Restez connectés pour ne rien rater</p>
  </div>

  <!-- LECTEUR FACEBOOK LIVE -->
  <div class="video-wrapper">
    <iframe 
      src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2F61582985333142%2Fvideos%2F1751501562775472%2F&show_text=false&autoplay=true"
      scrolling="no" 
      frameborder="0" 
      allowfullscreen="true"
      allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
    </iframe>
  </div>

  <!-- FALLBACK si l'iframe est bloquée par le navigateur -->
  <div class="fallback">
    <p class="fallback-text">
      💡 Le live ne s'affiche pas ? Ton navigateur bloque peut-être les vidéos intégrées.
    </p>
    <a href="https://www.facebook.com/61582985333142/videos/1751501562775472/" 
       target="_blank" 
       rel="noopener" 
       class="fallback-button">
      ▶️ OUVRIR LE LIVE SUR FACEBOOK
    </a>
  </div>

  <!-- INFO BAR -->
  <div class="info-bar">
    <span class="info-item">
      <span class="emoji">🎮</span> Live Godé
    </span>
    <span class="info-item">
      <span class="emoji">🎁</span> Bonus Pass
    </span>
    <span class="info-item">
      <span class="emoji">🗳️</span> Vote Mémodé
    </span>
  </div>

</main>

<!-- ========== FOOTER ========== -->
<footer class="footer">
  <span class="crown">👑</span>
  © Godé — Tous droits réservés
</footer>

</body>
</html>
